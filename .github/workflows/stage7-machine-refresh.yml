name: Stage 7 Machine Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/phase8-stage7-followup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical data
        run: npm run validate:data
      - name: Regenerate deterministic machine output
        run: npm run generate:machine
      - name: Commit generated output when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/machine version.json llms.txt ai.txt
          if git diff --cached --quiet; then
            echo "Machine output already synchronized."
          else
            git commit -m "Refresh Stage 7 machine output"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
