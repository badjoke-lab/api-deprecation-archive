name: Phase 9 Series Adapter Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/phase9-series-adapter-reference'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate native registry
        run: npm test
      - name: Generate deterministic Series adapter
        run: node scripts/generate-series-adapter.mjs
      - name: Validate generated Series adapter
        run: node scripts/generate-series-adapter.mjs --check
      - name: Commit adapter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series
          if git diff --cached --quiet; then
            echo "Series adapter output already synchronized."
          else
            git commit -m "Generate Phase 9 Series adapter output"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
