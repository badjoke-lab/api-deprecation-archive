name: Stage 3 Preview Verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-deprecation-stage3-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    if: github.head_ref == 'agent/phase8-machine-json'
    runs-on: ubuntu-latest
    env:
      API_DEP_ORIGIN: https://agent-phase8-machine-json.api-deprecation-archive.pages.dev
      API_DEP_VERIFY_ATTEMPTS: 20
      API_DEP_VERIFY_INTERVAL_MS: 15000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare preview machine layer
        run: node scripts/check-machine-origin.mjs
