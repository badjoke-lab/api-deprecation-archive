name: Stage 3 Machine Output Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/phase8-machine-json'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical source
        run: npm run validate:data

      - name: Generate deterministic machine output
        run: npm run generate:machine

      - name: Recheck generated output
        run: npm run validate:machine

      - name: Commit bootstrap output when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/machine version.json llms.txt ai.txt
          if git diff --cached --quiet; then
            echo "Machine output is already synchronized."
          else
            git commit -m "Bootstrap deterministic Stage 3 machine output"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
